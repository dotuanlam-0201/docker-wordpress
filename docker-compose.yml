version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: wordpress_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}",
        ]
      timeout: 10s
      retries: 5

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    ports:
      - "${WORDPRESS_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - wp_network
    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  wpcli:
    image: wordpress:cli
    container_name: wordpress_cli
    restart: "no"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}

      WORDPRESS_URL: ${WORDPRESS_URL}
      WORDPRESS_TITLE: ${WORDPRESS_TITLE}
      WORDPRESS_ADMIN_USERNAME: ${WORDPRESS_ADMIN_USERNAME}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
      WORDPRESS_LOCALE: ${WORDPRESS_LOCALE}
      WORDPRESS_TIMEZONE: ${WORDPRESS_TIMEZONE}

      PLUGIN_WP_MAIL_SMTP: ${PLUGIN_WP_MAIL_SMTP}
      PLUGIN_WORDFENCE: ${PLUGIN_WORDFENCE}
      PLUGIN_RANK_MATH: ${PLUGIN_RANK_MATH}
      PLUGIN_LITESPEED_CACHE: ${PLUGIN_LITESPEED_CACHE}
      PLUGIN_UPDRAFTPLUS: ${PLUGIN_UPDRAFTPLUS}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress-init.sh:/wordpress-init.sh:ro
    networks:
      - wp_network
    entrypoint: ["/bin/sh", "/wordpress-init.sh"]

volumes:
  db_data:
  wordpress_data:

networks:
  wp_network:
    driver: bridge
